<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Admin — Access Links</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>body{font-family:system-ui;padding:20px;background:#0b0b0b;color:#eee} .card{background:#121212;padding:18px;border-radius:8px;max-width:820px;margin:14px auto} input,select{padding:8px;border-radius:6px;border:1px solid #222;background:#0f0f0f;color:#eee;width:100%} button{padding:8px 12px;border-radius:6px;border:none;background:#2b6cff;color:#fff;cursor:pointer}</style>
</head>
<body>
  <div class="card">
    <h2>Create access link</h2>
    <label>User (optional; if blank link won't be saved):</label>
    <input id="user" placeholder="e.g. alice@example.com or Alice" />
    <label style="margin-top:8px">Duration (hours):</label>
    <input id="hours" type="number" value="1" min="0.25" step="0.25" />
    <label style="margin-top:8px"><input id="save" type="checkbox" checked /> Save link and enable autosave for this user</label>
    <div style="margin-top:10px">
      <button id="create">Create Link</button>
      <button id="logout" style="background:#444;margin-left:8px">Logout</button>
    </div>
    <div id="result" style="margin-top:10px;color:#9f9"></div>

    <h3 style="margin-top:18px">Saved links</h3>
    <button id="refresh" style="margin-bottom:8px">Refresh</button>
    <div id="links"></div>
  </div>

  <script>
    async function createLink() {
      const user = document.getElementById('user').value.trim() || null;
      const hours = Number(document.getElementById('hours').value) || 1;
      const save = document.getElementById('save').checked;
      const res = await fetch('/api/generate-link', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({user, hours, save})
      });
      const data = await res.json();
      if (!data.success) {
        document.getElementById('result').textContent = 'Error: ' + (data.error || 'unknown');
        return;
      }
      document.getElementById('result').innerHTML = `<div>URL: <a href="${data.url}" target="_blank">${data.url}</a></div>`;
      refreshLinks();
    }

    async function refreshLinks() {
      const res = await fetch('/api/access-links');
      const data = await res.json();
      if (!data.success) return;
      const out = data.links.map(l => `<div style="padding:8px;border-bottom:1px solid #1a1a1a"><b>${l.user || '(no-user)'}</b> — expires: ${new Date(l.expiresAt).toLocaleString()}<br/><a href="${l.url}" target="_blank">${l.url}</a></div>`).join('');
      document.getElementById('links').innerHTML = out || '<div class="muted">No saved links</div>';
    }

    document.getElementById('create').addEventListener('click', createLink);
    document.getElementById('refresh').addEventListener('click', refreshLinks);
    document.getElementById('logout').addEventListener('click', async () => {
      await fetch('/api/admin/logout', { method: 'POST' });
      window.location = '/';
    });

    refreshLinks();
  </script>
</body>
</html>
