<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>2nd Chrome - Isolated</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>body{font-family:system-ui;background:#111;color:#eee;padding:20px} .muted{color:#999}</style>
</head>
<body>
  <h2>2nd Chrome (isolated)</h2>
  <p class="muted">This page was opened with an access token embedded in the URL path. The client will autosave snapshots every 30s if the token was created and saved by the admin with a user.</p>

  <div id="status">Token: <span id="tk">-</span></div>
  <div id="log"></div>

<script>
(function(){
  function getTokenFromPath() {
    const path = location.pathname.split('/');
    const idx = path.indexOf('access');
    if (idx !== -1 && path[idx+1]) return path[idx+1];
    return null;
  }
  const token = getTokenFromPath();
  document.getElementById('tk').textContent = token ? token.slice(0, 12) + '...' : '(none)';

  if (!token) {
    document.getElementById('log').textContent = 'No token found in URL path.';
    return;
  }

  async function autosaveOnce() {
    try {
      // Example snapshot: collect some lightweight state. Replace with actual profile upload if desired.
      const snapshot = {
        title: document.title,
        url: location.href,
        timestamp: new Date().toISOString()
      };
      const html = JSON.stringify(snapshot, null, 2);
      const body = {
        token,
        filename: 'snapshot.json',
        contentBase64: btoa(unescape(encodeURIComponent(html)))
      };
      const res = await fetch('/api/save-profile', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify(body)
      });
      const data = await res.json();
      if (data && data.success) {
        const l = document.createElement('div');
        l.textContent = 'Autosave ok: ' + new Date().toLocaleTimeString();
        document.getElementById('log').appendChild(l);
      } else {
        const l = document.createElement('div');
        l.textContent = 'Autosave rejected: ' + (data && data.error ? data.error : 'unknown');
        document.getElementById('log').appendChild(l);
      }
    } catch (err) {
      const l = document.createElement('div');
      l.textContent = 'Autosave error: ' + err.message;
      document.getElementById('log').appendChild(l);
    }
  }

  const intervalMs = 30000;
  const tId = setInterval(autosaveOnce, intervalMs);
  // initial save shortly after load
  setTimeout(autosaveOnce, 1000);

  // On pagehide/unload try to send a final snapshot with sendBeacon
  function onUnload() {
    try {
      const snapshot = {
        title: document.title,
        url: location.href,
        timestamp: new Date().toISOString(),
        final: true
      };
      const payload = JSON.stringify({
        token,
        filename: 'snapshot-unload.json',
        contentBase64: btoa(unescape(encodeURIComponent(JSON.stringify(snapshot))))
      });
      const blob = new Blob([payload], { type: 'application/json' });
      navigator.sendBeacon('/api/save-profile', blob);
    } catch (err) {
      // ignore
    }
  }
  window.addEventListener('pagehide', onUnload);
  window.addEventListener('beforeunload', onUnload);
})();
</script>
</body>
</html>
